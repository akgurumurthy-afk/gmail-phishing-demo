<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gmail</title>
  <link rel="icon" href="https://ssl.gstatic.com/ui/v1/icons/mail/rfr/gmail.ico">
  <style>
    body {
      background-color: #f1f1f1;
      font-family: 'Roboto', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      background-color: #fff;
      width: 350px;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
      text-align: center;
    }
    img {
      width: 75px;
      margin-bottom: 20px;
    }
    h2 {
      font-weight: 400;
      margin-bottom: 20px;
    }
    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      width: 100%;
      background-color: #1a73e8;
      color: white;
      border: none;
      padding: 12px;
      font-size: 16px;
      border-radius: 4px;
      cursor: pointer;
    }
    .note {
      font-size: 12px;
      color: #777;
      margin-top: 15px;
    }
  </style>
</head>
<body>

<div class="container">
  <img src="https://ssl.gstatic.com/ui/v1/icons/mail/rfr/logo_gmail_lockup_default_1x_r2.png" alt="Gmail">
  <h2>Sign in</h2>
  <input type="text" id="email" placeholder="Email or phone">
  <input type="password" id="password" placeholder="Enter your password">
  <button onclick="phish()">Next</button>
  <p class="note">Not your computer? Use Guest mode to sign in privately.</p>
</div>

<script>
  function phish() {
    let email = document.getElementById("email").value;
    let password = document.getElementById("password").value;

    // Show phishing simulation alert
    alert(
      "⚠️ Phishing Simulation Demo Only ⚠️\n\n" +
      "You entered:\n" +
      "Email: " + email + "\n" +
      "Password: " + password + "\n\n" +
      "This is a fake login page for awareness. Do NOT trust look-alike websites!"
    );

    // Clear input fields
    document.getElementById("email").value = "";
    document.getElementById("password").value = "";
  }
</script>

</body>
</html>
